version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      # Puedes cambiar el usuario/contraseña por defecto de admin de Grafana aquí si no lo hiciste antes:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Clavepalatesis.
      - GF_INSTALL_PLUGINS=grafana-piechart-panel # Ejemplo de plugin, puedes añadir más si necesitas
    networks:
      - monitoring-network # Ambos servicios usarán esta red

  influxdb:
    image: influxdb:2.7.12-alpine # ¡AQUÍ ESTÁ EL CAMBIO! Usamos la versión que descargaste
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086" # Puerto por defecto de InfluxDB
    volumes:
      - influxdb-storage:/var/lib/influxdb2 # Volumen para datos persistentes de InfluxDB
      - ./influxdb-init:/docker-entrypoint-initdb.d # Opcional: para scripts de inicialización
    environment:
      # Variables de entorno para la configuración inicial de InfluxDB 2.x
      # ¡CAMBIA ESTOS VALORES POR TUS PROPIOS!
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin_influx
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin_influx
      - DOCKER_INFLUXDB_INIT_ORG=MiOrganizacion
      - DOCKER_INFLUXDB_INIT_BUCKET=estados_programa # Este será tu "bucket" principal
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=_ADZL7eFFOaugIzIqoDzXuL5_TkstXUrwmIdvsit9Xi_yHg1EDeUFz2d1QPtbGNkFCVnkHr679MwcdGYcxZVaw== # ¡Genera uno fuerte!
    networks:
      - monitoring-network # Ambos servicios usarán esta red

volumes:
  grafana-storage:
    external: true # Indica que este volumen ya ha sido creado previamente
  influxdb-storage:
    # Nuevo volumen para InfluxDB
    name: influxdb-storage # Nombre del volumen
    driver: local # Tipo de driver

networks:
  monitoring-network:
    # Definición de la red compartida
    driver: bridge
