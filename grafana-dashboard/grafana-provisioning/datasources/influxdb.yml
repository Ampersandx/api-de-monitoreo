apiVersion: 1

datasources:
  - name: influxdb # Nombre visible en Grafana
    type: influxdb
    access: proxy
    url: http://influxdb:8086 # ¡Importante! Usa el nombre del servicio Docker para InfluxDB
    orgId: 1
    version: 2
    isDefault: true # Opcional: Hacer esta la fuente de datos por defecto
    editable: true # Opcional: Permitir editarla desde la UI de Grafana (cambiar a false para solo provisionar)
    jsonData:
      # Estas son las configuraciones específicas de InfluxDB 2.x
      httpMode: POST
      defaultBucket: estados_programa # Tu bucket principal definido en InfluxDB
      organization: MiOrganizacion # Tu organización definida en InfluxDB
      # version: Flux # No es necesaria si usas InfluxDB 2.x, ya que Flux es el por defecto
    secureJsonData:
      # Aquí va el token de InfluxDB, ¡nunca lo expongas en texto plano si este archivo es público!
      # En Docker Compose, lo obtenemos de la variable de entorno, pero aquí se provisiona directamente.
      # Debes pegar el valor de tu DOCKER_INFLUXDB_INIT_ADMIN_TOKEN aquí.
      token: _ADZL7eFFOaugIzIqoDzXuL5_TkstXUrwmIdvsit9Xi_yHg1EDeUFz2d1QPtbGNkFCVnkHr679MwcdGYcxZVaw== # ¡REEMPLAZA CON TU TOKEN REAL!