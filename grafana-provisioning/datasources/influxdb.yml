apiVersion: 1

datasources:
  - name: monitoreodb # Nombre del datasource en Grafana
    type: influxdb
    access: proxy
    url: http://influxdb:8086 

    jsonData:
      dbName: estados_programa # Nombre del bucket
      httpHeaderName1: 'Authorization'

    secureJsonData:
      # Aquí va el token de InfluxDB
      httpHeaderValue1: 'Token ${INFLUXDB_TOKEN}'