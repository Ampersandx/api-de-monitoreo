version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Clavepalatesis.
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - monitoring-network # Ambos servicios usarán esta red

  influxdb:
    image: influxdb:2.7.12-alpine
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086" # Puerto por defecto de InfluxDB
    volumes:
      - influxdb-storage:/var/lib/influxdb2 # Volumen para datos persistentes de InfluxDB
      - ./influxdb-init:/docker-entrypoint-initdb.d
    environment:
      # Variables de entorno para la configuración inicial de InfluxDB 2.x
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin_influx
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin_influx
      - DOCKER_INFLUXDB_INIT_ORG=MiOrganizacion
      - DOCKER_INFLUXDB_INIT_BUCKET=estados_programa # bucket principal
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=_ADZL7eFFOaugIzIqoDzXuL5_TkstXUrwmIdvsit9Xi_yHg1EDeUFz2d1QPtbGNkFCVnkHr679MwcdGYcxZVaw==
    networks:
      - monitoring-network # Ambos servicios usarán esta red

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - monitoring-network
    env_file:
      - .env

  api-monitoreo:
    build:
      context: ./monitoreo
      dockerfile: Dockerfile
    container_name: api-monitoreo
    restart: unless-stopped
    networks:
      - monitoring-network
    env_file:
      - .env
    depends_on:
      - influxdb

volumes:
  grafana-storage:
    external: true # Indica que este volumen ya ha sido creado previamente
  influxdb-storage:
    # Nuevo volumen para InfluxDB
    name: influxdb-storage # Nombre del volumen
    driver: local # Tipo de driver

networks:
  monitoring-network:
    # Definición de la red compartida
    driver: bridge
